<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Validity</title>
<desc id="desc">Validation for Kotlin, written in plain Kotlin: type-safe rules, every error at once, zero dependencies.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F1FF"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7F52FF"/><stop offset="0.55" stop-color="#C711E1"/><stop offset="1" stop-color="#E44857"/></linearGradient>
<linearGradient id="underline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7F52FF"/><stop offset="0.6" stop-color="#C711E1"/><stop offset="1" stop-color="#E44857" stop-opacity="0"/></linearGradient>
<radialGradient id="glowPurple"><stop offset="0" stop-color="#7F52FF" stop-opacity="0.16"/><stop offset="1" stop-color="#7F52FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowCoral"><stop offset="0" stop-color="#E44857" stop-opacity="0.10"/><stop offset="1" stop-color="#E44857" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#7F52FF" fill-opacity="0.13"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/></linearGradient>
<mask id="dotsMask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
<clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5B3CC4" flood-opacity="0.28"/></filter>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#dots)" mask="url(#dotsMask)"/>
<circle cx="1010" cy="120" r="420" fill="url(#glowPurple)"/>
<circle cx="160" cy="420" r="340" fill="url(#glowCoral)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#E4DEFA"/>
<rect x="96" y="92" width="100" height="100" rx="26" fill="url(#brand)"/>
<path d="M120 142 L141 164 L173 118" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<text x="222" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2.5" fill="#1F2328">Validity</text>
<rect x="98" y="214" width="420" height="4" rx="2" fill="url(#underline)"/>
<text x="96" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#3D444D">Validation for Kotlin, written in plain Kotlin.</text>
<rect x="96" y="296" width="128" height="40" rx="20" fill="#FFFFFF" stroke="#DCD2FF"/>
<circle cx="118" cy="316" r="4" fill="url(#brand)"/>
<text x="171.0" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3CC4">Type-safe</text>
<rect x="238" y="296" width="214" height="40" rx="20" fill="#FFFFFF" stroke="#DCD2FF"/>
<circle cx="260" cy="316" r="4" fill="url(#brand)"/>
<text x="356.0" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3CC4">Every error at once</text>
<rect x="466" y="296" width="200" height="40" rx="20" fill="#FFFFFF" stroke="#DCD2FF"/>
<circle cx="488" cy="316" r="4" fill="url(#brand)"/>
<text x="577.0" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#5B3CC4">Zero dependencies</text>
<rect x="736" y="50" width="470" height="300" rx="18" fill="#14121F" stroke="#14121F" filter="url(#shadow)"/>
<path d="M754 50 H1188 A18 18 0 0 1 1206 68 V96 H736 V68 A18 18 0 0 1 754 50 Z" fill="#1C1A2B"/>
<circle cx="762" cy="73" r="6" fill="#FF5F57"/>
<circle cx="782" cy="73" r="6" fill="#FEBC2E"/>
<circle cx="802" cy="73" r="6" fill="#28C840"/>
<text x="971.0" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">Signup.kt</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17">
<text x="766" y="136"><tspan fill="#D2A8FF">validation</tspan><tspan fill="#E6EDF3"> {</tspan></text>
<text x="794" y="163"><tspan fill="#79C0FF">::email</tspan><tspan fill="#FF7B72"> required </tspan><tspan fill="#E6EDF3">{ </tspan><tspan fill="#D2A8FF">email</tspan><tspan fill="#E6EDF3">() }</tspan></text>
<text x="794" y="190"><tspan fill="#79C0FF">::age</tspan><tspan fill="#FF7B72"> ifPresent </tspan><tspan fill="#E6EDF3">{ </tspan><tspan fill="#D2A8FF">min</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#79C0FF">18</tspan><tspan fill="#E6EDF3">) }</tspan></text>
<text x="794" y="217"><tspan fill="#D2A8FF">exactlyOneOf</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#79C0FF">::card</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#79C0FF">::iban</tspan><tspan fill="#E6EDF3">)</tspan></text>
<text x="766" y="244"><tspan fill="#E6EDF3">}</tspan></text>
</g>
<line x1="760" y1="263" x2="1182" y2="263" stroke="#FFFFFF" stroke-opacity="0.08"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
<circle cx="773" cy="288" r="8" fill="#F85149" fill-opacity="0.18"/>
<path d="M770 285 L776 291 M776 285 L770 291" stroke="#F85149" stroke-width="2" stroke-linecap="round"/>
<text x="792" y="293" fill="#FFA198">email</text>
<text x="856" y="293" fill="#8B949E">must be a valid email</text>
<circle cx="773" cy="314" r="8" fill="#F85149" fill-opacity="0.18"/>
<path d="M770 311 L776 317 M776 311 L770 317" stroke="#F85149" stroke-width="2" stroke-linecap="round"/>
<text x="792" y="319" fill="#FFA198">age</text>
<text x="856" y="319" fill="#8B949E">must be at least 18</text>
</g>
</svg>
