<svg xmlns="http://www.w3.org/2000/svg" width="152" height="32" viewBox="0 0 152 32" role="img" aria-labelledby="title">
  <title id="title">Validity</title>
  <defs>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="40" y1="112" x2="150" y2="208">
      <stop offset="0" stop-color="#AE92FF"/>
      <stop offset="1" stop-color="#8A5FFF"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="120" y1="208" x2="210" y2="40">
      <stop offset="0" stop-color="#C711E1"/>
      <stop offset="1" stop-color="#E44857"/>
    </linearGradient>
    <clipPath id="backRibbon">
      <polygon points="40,112 96,112 150,208 94,208"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g transform="translate(0 1) scale(0.1786) translate(-28 -42)">
    <g transform="translate(-8 6)" stroke-linejoin="round" stroke-width="10">
    <polygon points="40,112 96,112 150,208 94,208" fill="url(#back)" stroke="url(#back)"/>
    <g clip-path="url(#backRibbon)">
      <polygon points="168,40 224,40 142,208 86,208" fill="#000000" fill-opacity="0.55" filter="url(#soft)"/>
    </g>
    <polygon points="176,40 232,40 150,208 94,208" fill="url(#front)" stroke="url(#front)"/>
  </g>
  </g>
  <text x="40" y="23.5" fill="#F4F1FF" font-family="Sora, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="-0.4">Validity</text>
</svg>
