# Vale checks the prose of the docs: spelling, repeated words and the voice of the site. Code, links and
# components are not prose, so they are skipped. Run it from docs/ with `vale .`.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Validity

IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Validity
Vale.Terms = NO
Vale.Spelling = NO

# Not prose: import lines, components and their attributes, {expressions}, {{variables}}, and camelCase words,
# which are always names of the API, such as ifPresent or mobilePhone.
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
(<[A-Z]\w*[^>]*>), \
\{[^}]*\}, \
\{\{\w+\}\}, \
\b[a-z]+(?:[A-Z][a-z0-9]*)+\b
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})
