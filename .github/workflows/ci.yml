name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov takes the OIDC token in place of an upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - run: ./gradlew :koverXmlReport
      - uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          disable_search: true
          use_oidc: true

  # The docs site: the Mintlify checks (MDX, navigation, links and anchors, accessibility), Stylelint and Vale. The
  # docs checks of the harness run in the build job, with ./gradlew build.
  docs:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.26.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run check
        working-directory: docs
      - name: Vale
        run: |
          base="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}"
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSLO "$base/$archive"
          curl -sSL "$base/vale_${VALE_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" vale
          cd docs && ../vale --output=line .
