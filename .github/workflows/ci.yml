name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov takes the OIDC token in place of an upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - run: ./gradlew :koverXmlReport
      - uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          disable_search: true
          use_oidc: true
