name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keeps a release pull request open with the next version and its changelog, read from the commits since the last
  # release. Merging it tags the commit and creates the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A new major version goes out as a release candidate first. The status stays red on the release pull request
      # until the Release candidate workflow has published one.
      - name: Ask for a release candidate before a major version
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --label "autorelease: pending" --json headRefOid --jq '.[0].headRefOid')
          [ -n "$pr" ] || exit 0
          next=$(gh api "repos/$GH_REPO/contents/.release-please-manifest.json?ref=$pr" --jq .content | base64 -d | jq -r '."."')
          case "$next" in
            0.*|*.*.[1-9]*|*.[1-9]*.*) exit 0 ;;
          esac
          if [ "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$next-RC" --jq length)" -gt 0 ]; then
            state=success description="A release candidate of $next is on Maven Central."
          else
            state=failure description="Run the Release candidate workflow to publish $next-RC1 first."
          fi
          gh api "repos/$GH_REPO/statuses/$pr" -f state="$state" -f context="Release candidate" -f description="$description"

  # Runs only on the merge of a release pull request.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # One publish to Maven Central at a time, never cancelled halfway; the Release candidate workflow shares the group.
    # The lock sits on the job, not the workflow: GitHub keeps one pending run per group and cancels the older one, so a
    # workflow-wide lock would let a later push cancel the run of a release merge.
    concurrency:
      group: maven-central
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the build has the released version
        run: |
          version=$(./gradlew properties --quiet | sed -n 's/^version: //p')
          if [ "$version" != "${{ needs.release-please.outputs.version }}" ]; then
            echo "The build has version $version, the release is ${{ needs.release-please.outputs.version }}"
            exit 1
          fi
      - run: ./gradlew build
      - run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # Once the version is on Maven Central, adds to the docs and the README what release-please cannot write: the version
  # link of the navbar and, at the first release, the dependency blocks in place of the notes. A push of the workflow's
  # token runs no workflow, so the job runs the docs checks itself before it pushes.
  show-release:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: node .github/scripts/show-release.mjs "${{ needs.release-please.outputs.version }}"
      - name: Look for changes
        id: changes
        run: echo "changed=$([ -n "$(git status --porcelain)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.changed == 'true'
      - name: Check the docs
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run docs:check
          ./gradlew :harness:test
      - name: Push the docs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "docs: show version ${{ needs.release-please.outputs.version }}"
          git pull --rebase origin main
          git push origin HEAD:main
