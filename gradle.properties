group=io.github.soleworks
# The Release workflow sets the version in its release pull request.
# x-release-please-start-version
version=0.6.0
# x-release-please-end
# How long publishToMavenCentral waits for the Central Portal to put a deployment on Maven Central: an hour, where a
# release usually takes minutes.
SONATYPE_CLOSE_TIMEOUT_SECONDS=3600

kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g
kotlin.daemon.jvmargs=-Xmx2g
